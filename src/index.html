          <div class="brand-name">Promptium</div>
          <div class="brand-sub">Boost your AI</div>
        </div>
      </div>
      <div class="lang-flags">
        <button class="active" id="lang-fr" title="Français">
          <svg viewBox="0 0 36 24"><rect width="12" height="24" fill="#002395"/><rect x="12" width="12" height="24" fill="#fff"/><rect x="24" width="12" height="24" fill="#ED2939"/></svg>
          <span>FR</span>
        </button>
        <button id="lang-en" title="English">
          <svg viewBox="0 0 60 30"><clipPath id="s"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#s)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#t)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg>
          <span>EN</span>
        </button>
      </div>
    </header>

    <div class="fields-card">
      <div class="card-banner"></div>
      <div class="field">
        <div class="field-top">
          <span class="field-dot dot-c"></span>
          <span class="field-title" data-i18n="label_context">Contexte</span>
          <span class="field-hint" data-i18n="hint_context">Le pourquoi de la démarche</span>
        </div>
        <textarea id="field-context" rows="2" data-i18n-placeholder="placeholder_context" placeholder="Ex : Je lance une boutique en ligne de produits artisanaux…"></textarea>
      </div>

      <div class="field">
        <div class="field-top">
          <span class="field-dot dot-r"></span>
          <span class="field-title" data-i18n="label_role">Rôle</span>
          <span class="field-hint" data-i18n="hint_role">L'expertise que l'IA doit incarner</span>
        </div>
        <textarea id="field-role" rows="2" data-i18n-placeholder="placeholder_role" placeholder="Ex : Tu es un expert en marketing digital avec 10 ans d'expérience…"></textarea>
      </div>

      <div class="field">
        <div class="field-top">
          <span class="field-dot dot-a"></span>
          <span class="field-title" data-i18n="label_action">Action</span>
          <span class="field-hint" data-i18n="hint_action">La tâche précise à accomplir</span>
        </div>
        <textarea id="field-action" rows="2" data-i18n-placeholder="placeholder_action" placeholder="Ex : Rédige un plan marketing en 5 étapes pour le lancement…"></textarea>
      </div>

      <div class="field">
        <div class="field-top">
          <span class="field-dot dot-f"></span>
          <span class="field-title" data-i18n="label_format">Format</span>
          <span class="field-hint" data-i18n="hint_format">La forme attendue du résultat</span>
        </div>
        <textarea id="field-format" rows="2" data-i18n-placeholder="placeholder_format" placeholder="Ex : Liste à puces, tableau, paragraphe de 200 mots…"></textarea>
      </div>

      <div class="field">
        <div class="field-top">
          <span class="field-dot dot-t"></span>
          <span class="field-title" data-i18n="label_target">Target</span>
          <span class="field-hint" data-i18n="hint_target">À qui s'adresse le résultat</span>
        </div>
        <textarea id="field-target" rows="2" data-i18n-placeholder="placeholder_target" placeholder="Ex : Destiné à des étudiants débutants…"></textarea>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="btn-generate" data-i18n="btn_generate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        Générer
      </button>
      <button class="btn btn-ghost" id="btn-copy" data-i18n="btn_copy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        Copier
      </button>
      <button class="btn btn-ghost" id="btn-email" data-i18n="btn_email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        Email
      </button>
      <button class="btn btn-ghost" id="btn-clear" data-i18n="btn_clear">
        Effacer
      </button>
    </div>

    <div class="output" id="output-section">
      <p class="output-label" data-i18n="output_title">Résultat généré</p>
      <div class="output-box">
        <pre id="output-text"></pre>
      </div>
    </div>
  </div>

  <footer>
    <span data-i18n="copyright">© 2026 Fabrice Lamour — Tous droits réservés</span>
  </footer>

  <div class="toast" id="toast"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
