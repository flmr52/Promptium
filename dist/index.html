<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Promptium — Boost your AI</title>
  <style>
:root {
  --bg: #0b0d13;
  --bg-elevated: #10131a;
  --surface: #151921;
  --surface-hover: #1a1f2a;
  --border: rgba(255, 255, 255, 0.06);
  --border-light: rgba(255, 255, 255, 0.08);
  --accent: #5b8dee;
  --accent-soft: rgba(91, 141, 238, 0.1);
  --accent-hover: rgba(91, 141, 238, 0.15);
  --text: #e8eaf0;
  --text-secondary: #8b92a5;
  --text-muted: #555d70;
  --danger: #ef4444;
  --danger-soft: rgba(239, 68, 68, 0.1);
  --success: #22c55e;
  --success-soft: rgba(34, 197, 94, 0.1);
  --radius: 12px;
  --radius-lg: 16px;
  --radius-sm: 8px;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { -webkit-font-smoothing: antialiased; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
  position: relative;
  background-image:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(91, 141, 238, 0.07), transparent 60%),
    radial-gradient(ellipse 60% 50% at 0% 80%, rgba(139, 92, 246, 0.04), transparent 50%),
    radial-gradient(ellipse 50% 40% at 100% 60%, rgba(56, 189, 248, 0.03), transparent 50%);
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
  background-size: 50px 50px;
  pointer-events: none;
  z-index: 0;
}

.app {
  position: relative;
  z-index: 1;
  max-width: 640px;
  margin: 0 auto;
  padding: 2.5rem 1.5rem 4rem;
}

footer {
  text-align: center;
  padding: 2rem 0 1rem;
  font-size: 0.6875rem;
  color: var(--text-muted);
  letter-spacing: 0.02em;
}

/* Header */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2.5rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--border);
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.brand-icon {
  width: 60px;
  height: 60px;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 0 16px rgba(91, 141, 238, 0.2), 0 0 4px rgba(91, 141, 238, 0.1);
}

.brand-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.brand-name {
  font-size: 1.75rem;
  font-weight: 700;
  background: linear-gradient(135deg, #ffffff, #7cb8ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.03em;
}

.brand-sub {
  font-size: 0.75rem;
  color: var(--text-secondary);
  margin-top: 2px;
  letter-spacing: 0.03em;
}

/* Language */
.lang-flags {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--surface);
  border-radius: 10px;
  border: 1px solid rgba(91, 141, 238, 0.1);
}

.lang-flags button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.375rem;
  border: none;
  background: transparent;
  padding: 0.4rem 0.6rem;
  border-radius: 7px;
  cursor: pointer;
  transition: all 0.15s;
  opacity: 0.5;
}

.lang-flags button svg {
  width: 18px;
  height: 12px;
  border-radius: 2px;
}

.lang-flags button span {
  font-size: 0.6875rem;
  font-weight: 500;
  color: var(--text-secondary);
}

.lang-flags button.active {
  background: var(--accent-soft);
  opacity: 1;
}

.lang-flags button.active span {
  color: var(--accent);
}

.lang-flags button:hover { opacity: 0.8; }

/* Fields card */
.fields-card {
  background: linear-gradient(180deg, var(--surface) 0%, rgba(15, 19, 28, 0.95) 100%);
  border: 1px solid rgba(91, 141, 238, 0.15);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3), 0 0 20px rgba(91, 141, 238, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.03);
}

.card-banner {
  height: 2px;
  background: linear-gradient(90deg, transparent, #5b8dee, #4facfe, #5b8dee, transparent);
  box-shadow: 0 1px 8px rgba(91, 141, 238, 0.3);
}

.field {
  padding: 1.125rem 1.5rem;
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
}

.field:last-child { border-bottom: none; }
.field:hover { background: var(--surface-hover); }

.field-top {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 0.5rem;
}

.field-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.dot-c { background: #5b8dee; box-shadow: 0 0 6px rgba(91, 141, 238, 0.6), 0 0 14px rgba(91, 141, 238, 0.25); }
.dot-r { background: #7ca8f4; box-shadow: 0 0 6px rgba(124, 168, 244, 0.6), 0 0 14px rgba(124, 168, 244, 0.25); }
.dot-a { background: #4facfe; box-shadow: 0 0 6px rgba(79, 172, 254, 0.6), 0 0 14px rgba(79, 172, 254, 0.25); }
.dot-f { background: #38bdf8; box-shadow: 0 0 6px rgba(56, 189, 248, 0.6), 0 0 14px rgba(56, 189, 248, 0.25); }
.dot-t { background: #818cf8; box-shadow: 0 0 6px rgba(129, 140, 248, 0.6), 0 0 14px rgba(129, 140, 248, 0.25); }

.field-title {
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--text);
}

.field-hint {
  font-size: 0.6875rem;
  color: var(--text-muted);
  margin-left: auto;
}

textarea {
  width: 100%;
  min-height: 110px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.625rem 0.875rem;
  font-family: 'Inter', sans-serif;
  font-size: 0.8125rem;
  color: var(--text);
  line-height: 1.6;
  resize: none;
  transition: all 0.2s;
}

textarea::placeholder { color: var(--text-muted); }
textarea:hover { border-color: var(--border-light); }

textarea:focus {
  outline: none;
  border-color: rgba(91, 141, 238, 0.5);
  box-shadow: 0 0 0 2px rgba(91, 141, 238, 0.1), 0 0 16px rgba(91, 141, 238, 0.08);
}

/* Output */
.output {
  display: none;
  margin-top: 1.5rem;
  animation: fade-in 0.3s ease;
}

.output.visible { display: block; }

@keyframes fade-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.output-label {
  font-size: 0.625rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 0.5rem;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.output-label::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #5b8dee;
  box-shadow: 0 0 6px rgba(91, 141, 238, 0.6), 0 0 14px rgba(91, 141, 238, 0.3);
  animation: neon-pulse 2s ease-in-out infinite;
}

@keyframes neon-pulse {
  0%, 100% { box-shadow: 0 0 6px rgba(91, 141, 238, 0.6), 0 0 14px rgba(91, 141, 238, 0.3); }
  50% { box-shadow: 0 0 8px rgba(91, 141, 238, 0.8), 0 0 20px rgba(91, 141, 238, 0.4); }
}

.output-box {
  background: linear-gradient(180deg, var(--surface) 0%, rgba(15, 19, 28, 0.95) 100%);
  border: 1px solid rgba(91, 141, 238, 0.1);
  border-radius: var(--radius);
  padding: 1rem 1.25rem;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
}

.output-box pre {
  font-family: 'SF Mono', 'Consolas', monospace;
  font-size: 0.75rem;
  line-height: 1.75;
  color: var(--text-secondary);
  white-space: pre-wrap;
  word-wrap: break-word;
}

/* Library panel - will be populated in Sprint 3 */
.library-panel {
  display: none;
}

/* Buttons */
.actions {
  display: flex;
  gap: 0.5rem;
  margin-top: 1.5rem;
  flex-wrap: wrap;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.6875rem 1.125rem;
  border: none;
  border-radius: 10px;
  font-family: 'Inter', sans-serif;
  font-size: 0.8125rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  -webkit-tap-highlight-color: rgba(91, 141, 238, 0.2);
  touch-action: manipulation;
}

.btn:active { transform: scale(0.97); }
.btn svg { width: 14px; height: 14px; }

.btn-primary {
  background: linear-gradient(135deg, #5b8dee, #4facfe);
  color: white;
  box-shadow: 0 2px 12px rgba(91, 141, 238, 0.35), 0 0 20px rgba(91, 141, 238, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.1);
}

.btn-primary:hover {
  box-shadow: 0 4px 20px rgba(91, 141, 238, 0.45), 0 0 28px rgba(91, 141, 238, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.15);
  transform: translateY(-1px);
}

.btn-ghost {
  background: rgba(91, 141, 238, 0.06);
  border: 1px solid rgba(91, 141, 238, 0.12);
  color: var(--text-secondary);
}

.btn-ghost:hover {
  background: rgba(91, 141, 238, 0.1);
  color: var(--text);
  border-color: rgba(91, 141, 238, 0.2);
}

.btn-danger {
  background: var(--danger-soft);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: var(--danger);
}

.btn-danger:hover {
  background: rgba(239, 68, 68, 0.15);
  border-color: rgba(239, 68, 68, 0.3);
}

/* Toast */
.toast {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%) translateY(40px);
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.5rem 1.25rem;
  border-radius: 8px;
  font-size: 0.75rem;
  font-weight: 500;
  opacity: 0;
  transition: all 0.3s ease;
  z-index: 1000;
  box-shadow: var(--shadow-md);
  pointer-events: none;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

@media (max-width: 600px) {
  .app { padding: 2rem 1rem 3rem; }
  .page-header h1 { font-size: 1.25rem; }
  .field-hint { display: none; }
  .actions { flex-direction: column; }
  .btn { width: 100%; justify-content: center; }
}

  </style>
