name: Deploy to GitHub Pages

on:
  push:
    branches:
      - stable
      - dev

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable
        uses: actions/checkout@v4
        with:
          ref: stable
          path: stable

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-src

      - name: Build site structure
        run: |
          mkdir -p _site/dev
          cp -r stable/* _site/ 2>/dev/null || true
          cp -r stable/.* _site/ 2>/dev/null || true
          cp -r dev-src/* _site/dev/ 2>/dev/null || true
          rm -rf _site/.git _site/.github _site/dev/.git _site/dev/.github

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
